name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - database: mysql:8.4
            health: mysqladmin ping -h 127.0.0.1 -pci-test-only
          - database: mariadb:10.11
            health: healthcheck.sh --connect --innodb_initialized
    services:
      mysql:
        image: ${{ matrix.database }}
        env:
          MYSQL_ROOT_PASSWORD: ci-test-only
          MYSQL_DATABASE: arkham_accounts_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="${{ matrix.health }}"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      MYSQL_TEST_URL: mysql://root:ci-test-only@127.0.0.1:3306/arkham_accounts_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # Las comprobaciones independientes de SQL solo necesitan una ejecución.
      - if: matrix.database == 'mysql:8.4'
        run: pnpm format:check
      - if: matrix.database == 'mysql:8.4'
        run: pnpm lint
      - if: matrix.database == 'mysql:8.4'
        run: pnpm typecheck
      - if: matrix.database == 'mysql:8.4'
        run: pnpm test
      - if: matrix.database == 'mariadb:10.11'
        run: pnpm test --project server src/accounts/accounts.mysql.test.ts
      - if: matrix.database == 'mysql:8.4'
        run: node scripts/verify-card-images.mjs
      # El paquete de producción se verifica contra ambos motores SQL.
      - run: pnpm build
      - run: node scripts/package-plesk.mjs
      - run: node scripts/verify-plesk.mjs
