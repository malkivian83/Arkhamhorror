name: Deploy

# Cuando la CI pasa en main, publica el paquete completo que instala Plesk:
# raíz privada con API y herramientas; public/ contiene únicamente la web.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: 'ID de una CI correcta de main con artefacto disponible (7 días)'
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - name: Identificar la CI validada de main
        id: source
        uses: actions/github-script@v7
        env:
          CI_RUN_ID: ${{ inputs.ci_run_id || github.event.workflow_run.id }}
        with:
          script: |
            const id = process.env.CI_RUN_ID;
            if (!/^\d+$/.test(id)) throw new Error('ID de CI inválido');
            const { data: run } = await github.rest.actions.getWorkflowRun({
              ...context.repo, run_id: Number(id)
            });
            if (run.path !== '.github/workflows/ci.yml' || run.conclusion !== 'success' ||
                run.event !== 'push' || run.head_branch !== 'main' ||
                run.head_repository?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              throw new Error('Solo se despliega una CI correcta de un push propio a main');
            }
            core.setOutput('sha', run.head_sha);
            core.setOutput('run-id', run.id);
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v4
        with:
          name: plesk-${{ steps.source.outputs.sha }}
          path: dist
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run-id }}
      - name: Extraer y comprobar la revisión del paquete
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          mkdir -p dist/plesk
          tar -xzf dist/plesk.tar.gz -C dist/plesk
          node --input-type=module -e "import fs from 'node:fs'; const info = JSON.parse(fs.readFileSync('dist/plesk/deploy-info.json', 'utf8')); if (info.revision !== process.env.SOURCE_SHA) throw new Error('El paquete no corresponde a la CI seleccionada');"
      - name: Publicar en la rama deploy
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Se añade un commit encima de la rama (sin forzar) para que Plesk
          # siempre pueda hacer un pull normal.
          if git ls-remote --exit-code --heads origin deploy > /dev/null; then
            git fetch --depth 1 origin deploy
            git worktree add --detach "$RUNNER_TEMP/publish" FETCH_HEAD
          else
            git worktree add --detach "$RUNNER_TEMP/publish"
            git -C "$RUNNER_TEMP/publish" checkout --orphan deploy
          fi

          cd "$RUNNER_TEMP/publish"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$GITHUB_WORKSPACE/dist/plesk/." .
          git add -A
          if git diff --cached --quiet; then
            echo 'Sin cambios que desplegar.'
            exit 0
          fi
          git commit -q -m "Desplegar ${SOURCE_SHA::7}"
          git push origin HEAD:refs/heads/deploy
