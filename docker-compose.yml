# Local development. Production must use its own credentials and private networks.
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env}
      MYSQL_USER: ${MYSQL_USER:-lcg}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD en .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lcg}
    command: ['--max-allowed-packet=32M']
    ports:
      - '127.0.0.1:3306:3306'
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -h 127.0.0.1 -uroot --silent',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
  mail:
    image: axllent/mailpit:v1.31.6
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'

volumes:
  mysqldata:
