<style>
  #arkham-mobile-design [data-phone] {
    width: min(390px, 100%);
    min-width: 0;
  }
  #arkham-mobile-design .ah-stage {
    display: grid;
    place-items: center;
    min-height: 824px;
    padding: 24px 12px 32px;
  }
  #arkham-mobile-design .ah-phone {
    --ah-bg: light-dark(#f4efe3, #101b17);
    --ah-panel: light-dark(#fff9eb, #18271f);
    --ah-text: light-dark(#28251b, #eee5d0);
    --ah-muted: light-dark(#625f4e, #b4c1af);
    --ah-line: light-dark(#c6bea6, #3c4c3c);
    --ah-gold: light-dark(#77561a, #d5b476);
    --ah-green: light-dark(#285f48, #9fd8ba);
    --ah-pressed: light-dark(#d7e7d9, #2b4a3b);
    --ah-felt: light-dark(#d5e2d5, #142b21);
    --ah-felt-line: light-dark(#a4bba8, #304b37);
    --ah-paper: light-dark(#f2e4c2, #e9d8ad);
    --ah-ink: #302416;
    --ah-red: light-dark(#9c3f33, #f0a497);
    --ah-shadow: light-dark(#3b3a2522, #00000070);
    width: min(390px, 100%);
    height: 760px;
    position: relative;
    display: flex;
    flex-direction: column;
    border: 1px solid var(--ah-line);
    border-radius: 25px;
    overflow: clip;
    background: var(--ah-bg);
    color: var(--ah-text);
    font:
      15px/1.4 system-ui,
      "Segoe UI",
      sans-serif;
    box-shadow: 0 18px 50px var(--ah-shadow);
    isolation: isolate;
  }
  #arkham-mobile-design .ah-phone * {
    box-sizing: border-box;
  }
  #arkham-mobile-design .ah-phone button {
    font: inherit;
    color: inherit;
    border: 0;
    background: transparent;
    padding: 0;
    touch-action: manipulation;
  }
  #arkham-mobile-design .ah-phone button:disabled {
    opacity: 0.45;
  }
  #arkham-mobile-design .ah-phone button:focus-visible {
    outline: 3px solid var(--ah-gold);
    outline-offset: -3px;
  }
  #arkham-mobile-design .ah-phone [hidden] {
    display: none !important;
  }
  #arkham-mobile-design .ah-phone svg {
    width: 19px;
    height: 19px;
    flex: none;
    stroke-width: 1.7;
  }
  #arkham-mobile-design .ah-phone h2,
  #arkham-mobile-design .ah-phone h3,
  #arkham-mobile-design .ah-phone p {
    margin: 0;
  }
  #arkham-mobile-design .ah-phone strong {
    font-weight: 650;
  }
  #arkham-mobile-design .ah-phone small {
    font-size: 12px;
  }
  #arkham-mobile-design .ah-header {
    padding: 14px 12px 8px 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--ah-panel);
  }
  #arkham-mobile-design .ah-brand {
    flex: 1;
    min-width: 0;
  }
  #arkham-mobile-design .ah-wordmark {
    font:
      600 17px/1.2 Georgia,
      serif;
    color: var(--ah-gold);
    letter-spacing: 2px;
  }
  #arkham-mobile-design .ah-phase {
    display: block;
    color: var(--ah-muted);
    margin-top: 4px;
    font-size: 12px;
  }
  #arkham-mobile-design .ah-icon {
    width: 44px;
    height: 44px;
    display: grid;
    place-items: center;
    flex: none;
    border-radius: 12px;
  }
  #arkham-mobile-design .ah-icon:hover {
    background: var(--ah-pressed);
  }
  #arkham-mobile-design .ah-investigator {
    margin: 0 12px 10px;
    padding: 10px 12px !important;
    border: 1px solid var(--ah-line) !important;
    border-radius: 13px;
    display: flex;
    gap: 10px;
    align-items: center;
    text-align: left;
    background: var(--ah-panel) !important;
  }
  #arkham-mobile-design .ah-avatar {
    display: grid;
    place-items: center;
    width: 39px;
    height: 43px;
    flex: none;
    border-radius: 7px;
    background: var(--ah-pressed);
    color: var(--ah-gold);
    font:
      600 18px Georgia,
      serif;
  }
  #arkham-mobile-design .ah-investigator-text {
    flex: 1;
    min-width: 0;
  }
  #arkham-mobile-design .ah-investigator-name {
    display: block;
    font-size: 14px;
  }
  #arkham-mobile-design .ah-stats {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 4px;
    color: var(--ah-muted);
    font-size: 12px;
  }
  #arkham-mobile-design .ah-stats span {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    white-space: nowrap;
  }
  #arkham-mobile-design .ah-stats svg {
    width: 13px;
    height: 13px;
  }
  #arkham-mobile-design .ah-actions-left {
    display: flex;
    flex-direction: column;
    gap: 3px;
    text-align: center;
    font-size: 11px;
    color: var(--ah-green);
  }
  #arkham-mobile-design .ah-action-dots {
    letter-spacing: 3px;
    font-size: 15px;
    white-space: nowrap;
  }
  #arkham-mobile-design .ah-case-strip {
    display: flex;
    gap: 0;
    border-top: 1px solid var(--ah-line);
    border-bottom: 1px solid var(--ah-line);
    background: var(--ah-panel);
  }
  #arkham-mobile-design .ah-case-strip button {
    flex: 1;
    min-height: 44px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 6px;
    font-size: 12px;
  }
  #arkham-mobile-design .ah-case-strip button + button {
    border-left: 1px solid var(--ah-line);
  }
  #arkham-mobile-design .ah-case-strip svg {
    width: 15px;
    height: 15px;
    color: var(--ah-gold);
  }
  #arkham-mobile-design .ah-map {
    flex: 1;
    min-height: 0;
    position: relative;
    overflow: clip;
    background:
      radial-gradient(ellipse at 50% 50%, transparent 10%, var(--ah-bg) 135%),
      repeating-linear-gradient(
        0deg,
        transparent 0 63px,
        var(--ah-felt-line) 64px 65px
      ),
      repeating-linear-gradient(
        90deg,
        transparent 0 63px,
        var(--ah-felt-line) 64px 65px
      ),
      var(--ah-felt);
  }
  #arkham-mobile-design .ah-map::before {
    content: "";
    position: absolute;
    width: 340px;
    height: 340px;
    border: 1px solid var(--ah-gold);
    opacity: 0.16;
    border-radius: 50%;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  #arkham-mobile-design .ah-map::after {
    content: "";
    position: absolute;
    width: 245px;
    height: 245px;
    border: 1px solid var(--ah-gold);
    opacity: 0.14;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) rotate(45deg);
    pointer-events: none;
  }
  #arkham-mobile-design .ah-map-world {
    position: absolute;
    width: 390px;
    height: 390px;
    transform-origin: 0 0;
    z-index: 1;
  }
  #arkham-mobile-design .ah-map-caption {
    position: absolute;
    left: 12px;
    top: 10px;
    right: 58px;
    font-size: 11px;
    color: var(--ah-muted);
    z-index: 2;
    pointer-events: none;
  }
  #arkham-mobile-design .ah-zoom {
    position: absolute;
    top: 9px;
    right: 10px;
    display: flex;
    flex-direction: column;
    border: 1px solid var(--ah-line);
    border-radius: 12px;
    background: var(--ah-panel);
    z-index: 3;
    overflow: hidden;
  }
  #arkham-mobile-design .ah-zoom button {
    width: 44px;
    height: 44px;
    display: grid;
    place-items: center;
  }
  #arkham-mobile-design .ah-zoom button + button {
    border-top: 1px solid var(--ah-line);
  }
  #arkham-mobile-design .ah-thread {
    position: absolute;
    height: 2px;
    background: var(--ah-red);
    opacity: 0.6;
    transform-origin: left;
    pointer-events: none;
  }
  #arkham-mobile-design .ah-thread-one {
    left: 120px;
    top: 130px;
    width: 148px;
  }
  #arkham-mobile-design .ah-thread-two {
    left: 268px;
    top: 130px;
    width: 155px;
    transform: rotate(90deg);
  }
  #arkham-mobile-design .ah-location {
    position: absolute;
    width: 112px;
    padding: 5px !important;
    background: var(--ah-paper) !important;
    color: var(--ah-ink) !important;
    border: 2px solid transparent !important;
    border-radius: 7px;
    box-shadow: 0 5px 12px var(--ah-shadow);
    text-align: center;
  }
  #arkham-mobile-design .ah-location[aria-pressed="true"] {
    border-color: var(--ah-green) !important;
    outline: 3px solid var(--ah-green);

  }

    top: 61px;
  }
  #arkham-mobile-design .ah-dorm {

    position: relative;

  #arkham-mobile-design .ah-loc-art svg {

    height: 35px;
    opacity: 0.8;

>

<script>
  (() => {
    const root = document.getElementById("arkham-mobile-design");
    if (!root) return;
    const template = document.getElementById("ah-mobile-template");
    const names = [
      "Alijo de emergencia",
      "Guardaespaldas",
      "Sombrero de fieltro",
      "Lección aprendida",
      "Intuición de detective",
    ];
    const labels = {
      hand: ["Tu mano", "5 cartas · toca una para verla"],
      equipment: ["Joe Diamond", "Investigador y cartas en juego"],
      case: ["El caso", "Spreading Flames"],
      journal: ["Diario del caso", "Ronda 1 · Investigación"],
      actions: ["Tus acciones", "Joe Diamond"],
      test: ["Investigar", "Prueba de Intelecto"],
      result: ["Resultado", "Ficha del caos"],
      card: ["Carta de tu mano", "Leer antes de jugar"],
      location: ["Tu localización", "Joe Diamond"],
      move: ["Explorar un lugar", "Elige cuándo moverte"],
      menu: ["Partida", "Opciones de la mesa"],
      end: ["Final de turno", "Confirma para continuar"],
      bag: ["Bolsa del caos", "Contenido de la bolsa"],
      commit: ["Comprometer cartas", "Elige una carta de tu mano"],
    };
    const controllers = [];
    let saved = window.openai?.widgetState?.privateContent?.screens || {};
    const icons = () => {
      if (globalThis.lucide)
        lucide.createIcons({ attrs: { width: 19, height: 19 } });
    };
    function save() {
      const screens = {};
      for (const c of controllers)
        screens[c.variant] = {
          panel: c.state.panel,
          card: c.state.card,
          largeText: c.state.largeText,
          panControls: c.state.panControls,
        };
      const active = controllers.find(
        (c) => !c.phone.closest("[data-variant]").hidden,
      );
      window.openai
        ?.setWidgetState?.({
          modelContent: {
            propuesta:
              active?.variant === "hand" ? "Mano a la vista" : "Mesa y paneles",
            panel: active?.state.panel || "map",
          },
          privateContent: { screens },
        })
        ?.catch(() => {});
    }
    for (const mount of root.querySelectorAll("[data-phone]")) {
      const variant = mount.dataset.phone;
      mount.append(template.content.cloneNode(true));
      const phone = mount.querySelector(".ah-phone");
      const state = {
        panel: "map",
        largeText: false,
        panControls: false,
        ...saved[variant],
        actions: 3,
        resources: 5,
        clues: 0,
        roomClues: 2,
        handCount: 5,
        card:
          Number.isInteger(saved[variant]?.card) &&
          saved[variant].card >= 0 &&
          saved[variant].card < names.length
            ? saved[variant].card
            : 0,
        location: "room",
        committed: false,
        testStage: null,
        played: false,
        log: [],
      };
      const surface = phone.querySelector(".ah-map");
      const world = phone.querySelector(".ah-map-world");
      const sheet = phone.querySelector(".ah-sheet");
      const body = phone.querySelector(".ah-sheet-content");
      let view = { x: 0, y: 0, scale: 1 };
      let autoFit = true;
      let gesture = null;
      const pointers = new Map();
      let moved = false;
      let toastTimer;
      let lastTrigger = null;
      let history = [];
      if (variant === "hand") {
        phone.classList.add("ah-compact");
        phone.querySelector(".ah-hand-peek").hidden = false;
      }
      function applyView() {
        world.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.scale})`;
      }
      function fit() {
        autoFit = true;
        view = {
          x: (surface.clientWidth - 390) / 2,
          y: (surface.clientHeight - 290) / 2,
          scale: 1,
        };
        if (surface.clientWidth < 350) {
          view.scale = 0.86;
          view.x = (surface.clientWidth - 390 * 0.86) / 2;
          view.y = (surface.clientHeight - 290 * 0.86) / 2;
        }
        applyView();
      }
      function zoom(factor, anchor) {
        autoFit = false;
        const p = anchor || {
          x: surface.clientWidth / 2,
          y: surface.clientHeight / 2,
        };
        const next = Math.max(0.8, Math.min(1.8, view.scale * factor));
        const r = next / view.scale;
        view = {
          scale: next,
          x: p.x - (p.x - view.x) * r,
          y: p.y - (p.y - view.y) * r,
        };
        applyView();
      }
      function settings() {
        phone.classList.toggle("ah-large", state.largeText);
        phone.querySelector(".ah-pan").hidden = !state.panControls;
      }
      function update() {
        phone.querySelectorAll("[data-card]").forEach((el) => {
          const index = Number(el.dataset.card);
          el.setAttribute(
            "aria-label",
            `${state.panel === "commit" ? "Comprometer" : "Ver"} ${names[index]}`,
          );
        });
        phone
          .querySelectorAll("[data-resources]")
          .forEach((el) => (el.textContent = String(state.resources)));
        phone
          .querySelectorAll("[data-clues]")
          .forEach((el) => (el.textContent = String(state.clues)));
        phone
          .querySelectorAll("[data-room-clues]")
          .forEach((el) => (el.textContent = String(state.roomClues)));
        phone
          .querySelectorAll("[data-hand-count]")
          .forEach((el) => (el.textContent = String(state.handCount)));
        phone.querySelector("[data-action-count]").textContent =
          `${state.actions} ${state.actions === 1 ? "acción" : "acciones"}`;
        phone.querySelector("[data-dots]").textContent =
          "●".repeat(state.actions) + "○".repeat(3 - state.actions);
        phone.querySelector("[data-dock-hint]").textContent = state.testStage
          ? "Prueba pendiente"
          : state.actions
            ? "Tu turno"
            : "Sin acciones";
        const primary = phone.querySelector(".ah-dock-actions .ah-primary");
        primary.dataset.open = state.testStage || "test";
        primary.querySelector("span").textContent = state.testStage
          ? "Continuar prueba"
          : "Investigar";
        primary.disabled = !state.actions && !state.testStage;
        phone.querySelector(".ah-dock-actions .ah-secondary").disabled =
          !state.actions || !!state.testStage;
        phone
          .querySelector('[data-location="room"]')
          .setAttribute(
            "aria-label",
            `Habitación de tu amigo. Tu localización. ${state.roomClues} pistas.`,
          );
        const currentTab = ["hand", "card", "commit"].includes(state.panel)
          ? "hand"
          : ["case", "bag"].includes(state.panel)
            ? "case"
            : ["equipment", "journal"].includes(state.panel)
              ? state.panel
              : "map";
        phone
          .querySelectorAll("[data-tab]")
          .forEach((el) =>
            el.setAttribute(
              "aria-pressed",
              String(el.dataset.tab === currentTab),
            ),
          );
        if (state.played)
          phone
            .querySelectorAll('[data-card="0"]')
            .forEach((el) => (el.hidden = true));
        else
          phone
            .querySelectorAll('[data-card="0"]')
            .forEach((el) => (el.hidden = false));
        settings();
      }
      function toast(message) {
        const node = phone.querySelector(".ah-toast");
        clearTimeout(toastTimer);
        node.textContent = message;
        node.hidden = false;
        toastTimer = setTimeout(() => (node.hidden = true), 2600);
      }
      function snapshot() {
        history.push({
          actions: state.actions,
          resources: state.resources,
          clues: state.clues,
          roomClues: state.roomClues,
          handCount: state.handCount,
          played: state.played,
          location: state.location,
          log: [...state.log],
        });
      }
      function open(panel, trigger, persist = true) {
        if (panel === "map") {
          close(persist);
          return;
        }
        if (trigger) lastTrigger = trigger;
        if (panel === "test" || panel === "result") state.testStage = panel;
        state.panel = panel;
        sheet.hidden = false;
        phone.querySelector(".ah-scrim").hidden = false;
        phone.querySelector(".ah-sheet-content").scrollTop = 0;
        const label = labels[panel] || labels.hand;
        phone.querySelector("[data-sheet-title]").textContent = label[0];
        phone.querySelector("[data-sheet-subtitle]").textContent =
          panel === "hand"
            ? `${state.handCount} cartas · toca una para verla`
            : label[1];
        const title = phone.querySelector("[data-sheet-title]");
        title.id = `ah-${variant}-sheet-title`;
        sheet.setAttribute("aria-labelledby", title.id);
        body.replaceChildren(
          document
            .getElementById(`ah-${panel === "commit" ? "hand" : panel}-panel`)
            .content.cloneNode(true),
        );
        if (panel === "card") {
          body.querySelector(".ah-detail-card").dataset.scanIndex = String(
            state.card,
          );
          body
            .querySelector(".ah-detail-scan")
            .setAttribute("aria-label", names[state.card]);
          body.querySelector("[data-card-name]").textContent =
            names[state.card];
          if (state.card !== 0) {
            body.querySelector("[data-card-type]").textContent = "EN TU MANO";
            body.querySelector("[data-card-text]").hidden = true;
            body.querySelector('[data-action="play"]').hidden = true;
          }
        }
        if (panel === "move")
          body.querySelector("[data-location-name]").textContent =
            state.location === "dorm" ? "Dormitorios" : "Patio de Miskatonic";
        if (panel === "journal") {
          const list = body.querySelector(".ah-log");
          for (const message of [...state.log].reverse()) {
            const li = document.createElement("li");
            li.textContent = message;
            list.prepend(li);
          }
        }
        if (panel === "end")
          body.querySelector("[data-end-description]").textContent =
            `Te quedan ${state.actions} ${state.actions === 1 ? "acción" : "acciones"}.`;
        if (panel === "test" && state.committed) {
          body.querySelector(".ah-duel strong").textContent = "5";
          body.querySelector('[data-open="commit"]').textContent =
            "1 carta comprometida · cambiar";
        }
        update();
        icons();
        if (persist) save();
        if (trigger) {
          requestAnimationFrame(() => {
            sheet
              .querySelector('[data-action="close"]')
              .focus({ preventScroll: true });
          });
        }
      }
      function close(persist = true) {
        state.panel = "map";
        sheet.hidden = true;
        phone.querySelector(".ah-scrim").hidden = true;
        update();
        if (persist) save();
      }
      function consume(message) {
        if (!state.actions) {
          toast("No quedan acciones.");
          return false;
        }
        snapshot();
        state.actions -= 1;
        state.log.push(message);
        return true;
      }
      phone.addEventListener(
        "click",
        (event) => {
          if (moved && event.detail > 0) {
            event.preventDefault();
            event.stopPropagation();
            return;
          }
          const button = event.target.closest("button");
          if (!button || button.disabled) return;
          const {
            tab,
            open: panel,
            action,
            card,
            location,
            pan,
          } = button.dataset;
          if (tab) {
            if (state.panel === tab) close();
            else open(tab, button);
            return;
          }
          if (panel) {
            open(panel, button);
            return;
          }
          if (card !== undefined) {
            if (state.panel === "commit") {
              state.committed = true;
              open("test");
              return;
            }
            state.card = Number(card);
            open("card", button);
            return;
          }
          if (location) {
            state.location = location;
            open(location === "room" ? "location" : "move", button);
            return;
          }
          if (pan) {
            autoFit = false;
            view.x += pan === "left" ? 55 : pan === "right" ? -55 : 0;
            view.y += pan === "up" ? 55 : pan === "down" ? -55 : 0;
            applyView();
            save();
            return;
          }
          if (action === "close") {
            close();
            if (lastTrigger?.isConnected)
              lastTrigger.focus({ preventScroll: true });
          }
          if (action === "zoom-in") zoom(1.2);
          if (action === "zoom-out") zoom(1 / 1.2);
          if (action === "fit") fit();
          if (action === "large-text") {
            state.largeText = !state.largeText;
            settings();
            toast(state.largeText ? "Texto ampliado" : "Texto normal");
          }
          if (action === "pan-controls") {
            state.panControls = !state.panControls;
            settings();
            close();
          }
          if (
            action === "resource" &&
            consume("Joe Diamond obtiene 1 recurso.")
          ) {
            state.resources += 1;
            close();
            toast("+1 recurso");
          }
          if (action === "draw" && consume("Joe Diamond roba una carta.")) {
            state.handCount += 1;
            close();
            toast("Carta robada · abre tu mano");
          }
          if (
            action === "play" &&
            consume("Joe Diamond juega Alijo de emergencia.")
          ) {
            state.resources += 3;
            state.handCount -= 1;
            state.played = true;
            close();
            toast("Alijo de emergencia · +3 recursos");
          }
          if (action === "reveal") {
            open("result");
            if (state.committed)
              body.querySelector(".ah-result p").textContent =
                "Intelecto 4 contra velo 2";
          }
          if (
            action === "resolve" &&
            consume("Joe Diamond investiga y descubre 1 pista.")
          ) {
            state.clues += 1;
            state.roomClues = Math.max(0, state.roomClues - 1);
            state.committed = false;
            state.testStage = null;
            close();
            toast("Has descubierto 1 pista");
          }
          if (
            action === "move" &&
            consume("Joe Diamond se mueve a otra localización.")
          ) {
            close();
            toast("Investigador desplazado");
          }
          if (action === "end") {
            snapshot();
            state.actions = 0;
            state.log.push("Joe Diamond termina su turno.");
            close();
            toast("Turno terminado");
          }
          if (action === "undo") {
            const previous = history.pop();
            if (previous) {
              Object.assign(state, previous);
              close();
              toast("Última acción deshecha");
            } else toast("No hay acciones que deshacer.");
          }
          update();
          save();
        },
        true,
      );
      function local(event) {
        const rect = surface.getBoundingClientRect();
        return { x: event.clientX - rect.left, y: event.clientY - rect.top };
      }
      function shape() {
        const [a, b] = [...pointers.values()];
        if (!a) return null;
        return b
          ? {
              x: (a.x + b.x) / 2,
              y: (a.y + b.y) / 2,
              d: Math.hypot(a.x - b.x, a.y - b.y),
            }
          : { ...a, d: 0 };
      }
      function baseline() {
        const p = shape();
        gesture = p ? { ...p, view: { ...view } } : null;
      }
      surface.style.touchAction = "none";
      surface.addEventListener("pointerdown", (event) => {
        if (event.target.closest(".ah-zoom,.ah-pan")) return;
        if (event.pointerType === "mouse" && event.button !== 0) return;
        if (!pointers.size) moved = false;
        pointers.set(event.pointerId, local(event));
        baseline();
      });
      surface.addEventListener("pointermove", (event) => {
        if (!pointers.has(event.pointerId) || !gesture) return;
        pointers.set(event.pointerId, local(event));
        const p = shape();
        if (
          !moved &&
          pointers.size === 1 &&
          Math.hypot(p.x - gesture.x, p.y - gesture.y) < 7
        )
          return;
        moved = true;
        autoFit = false;
        surface.classList.add("dragging");
        surface.setPointerCapture(event.pointerId);
        const scale = Math.max(
          0.8,
          Math.min(1.8, gesture.view.scale * (gesture.d ? p.d / gesture.d : 1)),
        );
        const r = scale / gesture.view.scale;
        view = {
          scale,
          x: p.x - (gesture.x - gesture.view.x) * r,
          y: p.y - (gesture.y - gesture.view.y) * r,
        };
        applyView();
      });
      const end = (event) => {
        pointers.delete(event.pointerId);
        baseline();
        if (!pointers.size) {
          surface.classList.remove("dragging");
          setTimeout(() => (moved = false), 200);
        }
      };
      surface.addEventListener("pointerup", end);
      surface.addEventListener("pointercancel", end);
      phone.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          close();
          lastTrigger?.focus({ preventScroll: true });
        }
      });
      const resize = new ResizeObserver(() => {
        if (autoFit && surface.clientWidth) fit();
      });
      resize.observe(surface);
      settings();
      update();
      phone.setAttribute(
        "aria-label",
        variant === "hand" ? "Mano a la vista" : "Mesa y paneles",
      );
      const controller = { variant, phone, state, open, settings };
      controllers.push(controller);
      if (state.panel !== "map" && labels[state.panel])
        open(state.panel, undefined, false);
      else fit();
      if (globalThis.Tweak) {
        const tweak = new Tweak({
          container: phone,
          onChange: () => {
            settings();
            save();
          },
        });
        tweak.addToggle(state, "largeText", { label: "Texto grande" });
        tweak.addToggle(state, "panControls", {
          label: "Desplazar con botones",
        });
      }
    }
    window.addEventListener("openai:set_globals", (event) => {
      const screens =
        event.detail?.globals?.widgetState?.privateContent?.screens;
      if (!screens) return;
      for (const c of controllers) {
        const value = screens[c.variant];
        if (!value) continue;
        c.state.largeText = !!value.largeText;
        c.state.panControls = !!value.panControls;
        c.settings();
        if (
          value.panel &&
          value.panel !== c.state.panel &&
          (value.panel === "map" || labels[value.panel])
        ) {
          c.open(value.panel, undefined, false);
        }
      }
    });
    icons();
  })();
</script>
